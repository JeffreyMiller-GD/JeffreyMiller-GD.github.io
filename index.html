<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jeffrey Miller</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #e6e6e6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .description {
            font-size: 20px;
            color: #9ca3af;
        }

        h2 {
            margin-top: 70px;
            font-size: 30px;
        }

        .projects {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .project {
            background: #181b23;
            border: 1px solid #2a2e38;
            border-radius: 12px;
            padding: 25px;
            width: 250px;
        }

        .project h3 {
            margin-top: 0;
        }

        .project p {
            color: #9ca3af;
        }

        .project a {
            color: #6ea8fe;
            text-decoration: none;
        }

        .project a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Jeffrey Miller</h1>

        <p class="description">
            C++ Developer / Student
        </p>

        <h2>Projects</h2>

        <div class="projects">

            <div class="project">
                <h3>Student Manager</h3>

                <p>
                    A student management system written in C++. But it is public archive.
                </p>

                <a href="https://github.com/JeffreyMiller-GD/Student-Manager">
                    View on GitHub →
                </a>
            </div>

            <div class="project">
                <h3>Project Manager</h3>

                <p>
                    Another C++ project.
                </p>

                <a href="https://github.com/JeffreyMiller-GD/Project-Manager">
                    View on GitHub →
                </a>
            </div>

        </div>

    </main>

</body>
</html>
